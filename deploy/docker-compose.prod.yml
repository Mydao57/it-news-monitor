services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/it-news-monitor
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-15}
      CORS_ORIGIN: https://${DOMAIN}

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
